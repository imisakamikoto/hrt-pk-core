version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # serde and serde_json move together; three separate PRs for one bump is
      # noise on a library this small.
      runtime:
        patterns: ["serde*", "itoa", "ryu", "memchr"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
